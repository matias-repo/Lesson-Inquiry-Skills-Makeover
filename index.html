<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>IB EE Examiner Training Suite v4.4 · Compact</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      color: #e0e0e0;
      padding: 8px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-container {
      max-width: 950px;
      width: 100%;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(180deg, #0f3460, #16213e);
      padding: 14px 18px;
      text-align: center;
      border-bottom: 2px solid #e94560;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #e94560;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header .subtitle {
      font-size: 13px;
      color: #a0a0a0;
      margin-top: 2px;
    }

    .stats-bar {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      padding: 8px 12px;
      background: #0f3460;
      border-bottom: 1px solid #1a1a4e;
      justify-content: space-between;
      align-items: center;
      overflow-x: auto;
    }

    .stat-item {
      background: #16213e;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #1a1a4e;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 55px;
    }

    .stat-value {
      font-size: 18px;
      color: #e94560;
      font-weight: 800;
      margin-top: 1px;
    }

    .mode-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 10px;
      background: #0a0a1a;
      border-bottom: 1px solid #1a1a4e;
      justify-content: center;
    }

    .mode-btn {
      padding: 6px 10px;
      background: #16213e;
      border: 1px solid #1a1a4e;
      color: #c0c0c0;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 5px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.2;
    }

    .mode-btn:hover {
      background: #0f3460;
      border-color: #e94560;
      color: #e94560;
    }

    .mode-btn.active {
      background: #e94560;
      color: white;
      border-color: #c23152;
      box-shadow: 0 0 12px rgba(233,69,96,0.4);
    }

    .mode-btn .mode-timer {
      font-size: 9px;
      color: #ffaa00;
      margin-top: 2px;
      font-weight: 400;
    }

    .content-area {
      padding: 14px;
      background: #0d1b2e;
      min-height: 380px;
    }

    .progress-bar {
      height: 6px;
      background: #0a0a1a;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      transition: width 0.4s ease;
    }

    .question-card {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .question-header {
      font-size: 17px;
      font-weight: 800;
      color: #e94560;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #0f3460;
    }

    .essay-box {
      background: #0a0a1a;
      border: 2px solid #1a1a4e;
      border-radius: 8px;
      padding: 12px;
      margin: 6px 0;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
      line-height: 1.5;
      color: #e0e0e0;
    }

    .essay-box:hover {
      border-color: #e94560;
      background: #12122a;
    }

    .essay-box.selected {
      border-color: #e94560;
      background: #1a0a1a;
      box-shadow: 0 0 12px rgba(233,69,96,0.3);
    }

    .essay-box.correct {
      border-color: #00cc66;
      background: #0a1a0a;
    }

    .essay-box.incorrect {
      border-color: #ff4444;
      background: #1a0a0a;
    }

    .essay-label {
      font-weight: 800;
      color: #e94560;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .essay-section {
      margin-bottom: 6px;
    }

    .essay-section h4 {
      color: #ff6b6b;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .essay-section p {
      margin-left: 6px;
      color: #c0c0c0;
      font-size: 11px;
    }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #e94560;
      color: white;
    }

    .btn-primary:hover {
      background: #c23152;
    }

    .btn-secondary {
      background: #0f3460;
      color: white;
    }

    .btn-secondary:hover {
      background: #1a4a7a;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .feedback-panel {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      display: none;
      animation: fadeIn 0.3s;
    }

    .feedback-panel.visible {
      display: block;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .error-item {
      background: #0a0a1a;
      border-left: 4px solid #e94560;
      padding: 8px;
      margin: 4px 0;
      border-radius: 4px;
      font-size: 11px;
    }

    .grade-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 800;
      margin-right: 4px;
    }

    .grade-a { background: #00cc66; color: white; }
    .grade-b { background: #33cc33; color: white; }
    .grade-c { background: #ff9933; color: white; }
    .grade-d { background: #ff4444; color: white; }

    .sentence-item {
      background: #0a0a1a;
      border: 2px solid #1a1a4e;
      border-radius: 6px;
      padding: 10px;
      margin: 5px 0;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.4;
      transition: all 0.2s;
    }

    .sentence-item:hover {
      border-color: #e94560;
      background: #12122a;
    }

    .sentence-item.selected {
      border-color: #e94560;
      background: #1a0a1a;
    }

    .matching-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .match-item {
      background: #0a0a1a;
      border: 2px solid #1a1a4e;
      border-radius: 6px;
      padding: 8px;
      margin: 4px 0;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
      word-break: break-word;
    }

    .match-item.selected {
      border-color: #e94560;
    }

    .match-item.matched {
      border-color: #00cc66;
      background: #0a1a0a;
    }

    /* Leaderboard Styles */
    .leaderboard {
      background: #0f1629;
      border: 2px solid #e94560;
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
      text-align: center;
      animation: fadeIn 0.5s;
    }

    .leaderboard h2 {
      color: #e94560;
      margin-bottom: 4px;
      font-size: 20px;
    }

    .leaderboard .subtitle {
      color: #a0a0a0;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #16213e;
      margin: 4px 0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid #1a1a4e;
      flex-wrap: wrap;
      gap: 4px;
    }

    .leaderboard-entry.highlight {
      border-color: #e94560;
      background: #1a1a3e;
      box-shadow: 0 0 10px rgba(233,69,96,0.3);
    }

    .leaderboard-rank {
      font-size: 16px;
      font-weight: 800;
      color: #ffaa00;
      width: 25px;
    }

    .leaderboard-initials {
      background: #e94560;
      color: white;
      padding: 3px 8px;
      border-radius: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 11px;
    }

    .leaderboard-score {
      color: #00cc66;
      font-size: 14px;
    }

    .input-group {
      margin: 12px 0;
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .initials-input {
      background: #0a0a1a;
      border: 2px solid #e94560;
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 14px;
      width: 80px;
      text-align: center;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .initials-input:focus {
      outline: none;
      border-color: #ff6b6b;
      box-shadow: 0 0 8px rgba(233,69,96,0.4);
    }

    .clear-scores-btn {
      background: transparent;
      border: 1px solid #ff4444;
      color: #ff4444;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      margin-top: 10px;
    }

    .clear-scores-btn:hover {
      background: #ff4444;
      color: white;
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 18px; }
      .essay-box { font-size: 11px; padding: 8px; }
      .matching-grid { grid-template-columns: 1fr; }
      .mode-btn { padding: 5px 8px; font-size: 9px; }
      .stats-bar { gap: 3px; }
      .stat-item { padding: 4px 6px; }
      .stat-value { font-size: 16px; }
      .btn { padding: 6px 10px; font-size: 10px; }
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="header">
    <h1>IB EE Examiner Training Suite</h1>
    <div class="subtitle">Professional Assessment Tool v4.4 · Streamlined</div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div>SCORE</div><div class="stat-value" id="score-display">0</div></div>
    <div class="stat-item"><div>STREAK</div><div class="stat-value" id="streak-display">0</div></div>
    <div class="stat-item"><div>ACC</div><div class="stat-value" id="accuracy-display">0%</div></div>
    <div class="stat-item"><div>Q'S</div><div class="stat-value" id="question-display">0/25</div></div>
    <div class="stat-item"><div>⏱️</div><div class="stat-value" id="time-display">0:00</div></div>
  </div>

  <div class="mode-nav" id="mode-nav">
    <button class="mode-btn active" data-mode="compare">📝 Compare <span class="mode-timer" id="timer-compare">0:00</span></button>
    <button class="mode-btn" data-mode="sentence">🔍 Hunt <span class="mode-timer" id="timer-sentence">0:00</span></button>
    <button class="mode-btn" data-mode="matching">📎 Match <span class="mode-timer" id="timer-matching">0:00</span></button>
    <button class="mode-btn" data-mode="fillblank">✍️ Blank <span class="mode-timer" id="timer-fillblank">0:00</span></button>
    <button class="mode-btn" data-mode="timeline">⏳ Speed <span class="mode-timer" id="timer-timeline">0:00</span></button>
    <button class="mode-btn" data-mode="sorting">🔢 Order <span class="mode-timer" id="timer-sorting">0:00</span></button>
  </div>

  <div class="content-area" id="content-area"></div>
  <div id="leaderboard-container" style="padding: 0 14px 14px;"></div>
</div>

<script>
  // ============ GAME STATE v4.4 ============
  const state = {
    score: 0,
    questionsAnswered: 0,
    totalQuestions: 25,
    streak: 0,
    correctAnswers: 0,
    globalTime: 0,
    currentMode: 'compare',
    modeTimers: { compare: 0, sentence: 0, matching: 0, fillblank: 0, timeline: 0, sorting: 0 },
    modeQuestionCount: { compare: 0, sentence: 0, matching: 0, fillblank: 0, timeline: 0, sorting: 0 },
    questionData: null,
    answered: false,
    selectedAnswer: null,
    speedTimer: null,
    speedTimeLeft: 0,
    matchPairs: {},
    selectedSource: null,
    sortOrder: [],
    timelineAnswers: {},
    modeIntervalId: null,
    playerInitials: null,
    gameEnded: false
  };

  // ============ LOCAL STORAGE ============
  const STORAGE_KEY = 'ib_ee_trainer_leaderboard_v44';

  function loadPersistentLeaderboard() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
  }

  function savePersistentLeaderboard(entries) {
    try {
      const sorted = entries.sort((a, b) => b.score - a.score).slice(0, 10);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sorted));
      return sorted;
    } catch (e) { return entries; }
  }

  // ============ EXPANDED DATABASE ============
  const essayDB = [
    { id: 'eng1', subject: 'English A: Literature', rq: 'To what extent does Virginia Woolf\'s use of free indirect discourse in Mrs Dalloway influence the reader\'s perception of time?', candidate: '004512-0032', session: 'May 2024', intro: 'Examines narrative technique in Woolf\'s modernist novel.', analysis: 'Close reading demonstrates how Woolf creates "narrative time."', conclusion: 'Woolf\'s innovation invites readers into multiple temporal planes.', works: ['Woolf, Virginia. Mrs Dalloway. Hogarth Press, 1925.', 'Genette, Gérard. Narrative Discourse. Cornell UP, 1980.'] },
    { id: 'geo1', subject: 'Geography', rq: 'How effective have international climate agreements been since 1997?', candidate: '007821-0045', session: 'Nov 2023', intro: 'Evaluates Kyoto Protocol and Paris Agreement.', analysis: 'EU emissions dropped 23%, India\'s rose 14%.', conclusion: 'Effectiveness depends on binding mechanisms.', works: ['IPCC. Climate Change 2022. Cambridge UP, 2022.', 'UN. Paris Agreement. Treaty Series, 2015.'] },
    { id: 'phil1', subject: 'Philosophy', rq: 'Can Searle\'s Chinese Room refute strong AI?', candidate: '003409-0018', session: 'May 2025', intro: 'Critically evaluates Searle\'s thought experiment.', analysis: 'Distinction between syntax and semantics challenges functionalism.', conclusion: 'Not a decisive refutation given neural network advances.', works: ['Searle, J. "Minds, Brains, Programs." BBS, 1980.', 'Dennett, D. Consciousness Explained. 1991.'] },
    { id: 'hist1', subject: 'History', rq: 'Did the Treaty of Versailles cause extremism in Germany?', candidate: '009234-0056', session: 'Nov 2024', intro: 'Investigates causal relationship between treaty and radicalization.', analysis: 'Reparations created instability exploited by extremists.', conclusion: 'Significant but not exclusive factor.', works: ['Keynes, J.M. Economic Consequences. 1919.', 'Evans, R. Third Reich. 2004.'] }
  ];

  const errorDB = {
    rq_broad: { name: 'Overly Broad RQ', criterion: 'A', grade: 'D', explanation: 'Lacks focus for 4000 words.', fix: 'Add specific context.' },
    informal_lang: { name: 'Informal Register', criterion: 'B', grade: 'D', explanation: 'Colloquial language present.', fix: 'Use academic equivalents.' },
    citation_format: { name: 'Inconsistent Citations', criterion: 'D', grade: 'C', explanation: 'Styles are mixed.', fix: 'Stick to one style.' },
    descriptive_conclusion: { name: 'Descriptive Conclusion', criterion: 'C', grade: 'D', explanation: 'Summarizes instead of synthesizing.', fix: 'Answer RQ analytically.' },
    missing_pages: { name: 'Missing Page Numbers', criterion: 'D', grade: 'C', explanation: 'Quotations lack pages.', fix: 'Include page numbers.' },
    weak_topic: { name: 'Weak Topic Sentences', criterion: 'C', grade: 'D', explanation: 'Starts with facts not claims.', fix: 'Begin with arguments.' }
  };

  function buildPerfectEssay(essay) {
    return `<div class="essay-label">${essay.subject} · ${essay.session}</div>
      <div class="essay-section"><b>RQ:</b> ${essay.rq}</div>
      <div class="essay-section"><h4>Intro</h4><p>${essay.intro}</p></div>
      <div class="essay-section"><h4>Analysis</h4><p>${essay.analysis}</p></div>
      <div class="essay-section"><h4>Conclusion</h4><p>${essay.conclusion}</p></div>
      <div class="essay-section"><h4>Works Cited</h4>${essay.works.map(w => `<p>${w}</p>`).join('')}</div>`;
  }

  function applyError(html, essay, key) {
    switch(key) {
      case 'rq_broad': return html.replace(essay.rq, 'How does literature affect people?');
      case 'informal_lang': return html.replace('Examines', 'Looks at').replace('demonstrates', 'shows');
      case 'citation_format': return html.replace('Hogarth Press, 1925.', 'Hogarth Press, 1925 (no italics).');
      case 'descriptive_conclusion': return html.replace(essay.conclusion, 'In conclusion, many aspects were discussed.');
      case 'missing_pages': return html.replace('BBS, 1980.', 'BBS, 1980.');
      case 'weak_topic': return html.replace(essay.analysis.substring(0,50), 'This topic is very interesting.');
      default: return html;
    }
  }

  // ============ MODE GENERATORS ============
  function generateCompareMode() {
    const essay = essayDB[Math.floor(Math.random() * essayDB.length)];
    const correctIdx = Math.floor(Math.random() * 3);
    let options = [];
    for (let i = 0; i < 3; i++) {
      if (i === correctIdx) options.push({ html: buildPerfectEssay(essay), correct: true, errors: [] });
      else {
        const keys = Object.keys(errorDB).sort(() => Math.random() - 0.5).slice(0, 2);
        let html = buildPerfectEssay(essay); const errs = [];
        keys.forEach(k => { html = applyError(html, essay, k); errs.push(errorDB[k]); });
        options.push({ html, correct: false, errors: errs });
      }
    }
    return { essay, options, correctIdx };
  }

  function generateSentenceMode() {
    const key = Object.keys(errorDB)[Math.floor(Math.random() * Object.keys(errorDB).length)];
    const err = errorDB[key];
    const bad = {
      rq_broad: 'RQ: How does literature affect people?',
      informal_lang: "This essay will look at how the author's technique changes things.",
      citation_format: 'Works Cited: Woolf, V. (1925) Mrs Dalloway. Hogarth Press. Genette, G. Narrative Discourse. Cornell UP, 1980.',
      descriptive_conclusion: 'In conclusion, this essay discussed many aspects.',
      missing_pages: '"She had the perpetual sense of being out at sea" (Woolf, 1925).',
      weak_topic: 'Virginia Woolf was born in 1882 and wrote many novels.'
    };
    const good = ['Analysis reveals a fluid temporality (Ricoeur, p. 102).','EU emissions dropped 23% (IPCC, 2022).','Genette distinguishes voice and focalization (pp. 185-189).','Legally binding targets proved more effective.','Psychological impact was as crucial as economic consequences.','Microplastic concentration negatively correlated (r = -0.82).'];
    const sentences = []; const errPos = Math.floor(Math.random() * 4);
    const shuffledGood = good.sort(() => Math.random() - 0.5);
    for (let i = 0; i < 4; i++) {
      if (i === errPos) sentences.push({ text: bad[key], hasError: true, error: err });
      else sentences.push({ text: shuffledGood[i] || good[0], hasError: false, error: null });
    }
    return { sentences, errorPos: errPos, error: err };
  }

  function generateMatchingMode() {
    const allPairs = [
      { citation: 'Woolf, V. Mrs Dalloway. Hogarth Press, 1925.', grade: 'A (Excellent)', reason: 'Complete MLA: author, title, publisher, year.' },
      { citation: 'Woolf, V. mrs dalloway. hogarth press, 1925', grade: 'D (Poor)', reason: 'Capitalization errors in title/publisher.' },
      { citation: 'Genette, Gérard. Narrative Discourse. Cornell UP, 1980.', grade: 'B (Good)', reason: 'Proper MLA, minor punctuation variation.' },
      { citation: 'ipcc report climate change 2022', grade: 'D (Poor)', reason: 'No proper formatting, missing publisher.' },
      { citation: 'Keynes, J.M. The Economic Consequences. Macmillan, 1919.', grade: 'A (Excellent)', reason: 'Classic MLA format for a seminal work.' },
      { citation: 'Searle, J. Minds Brains Programs. BBS, 1980.', grade: 'C (Adequate)', reason: 'Missing quotation marks for article title.' },
      { citation: 'Dennett, D. Consciousness Explained. Little Brown, 1991.', grade: 'B (Good)', reason: 'Correct book format, publisher present.' },
      { citation: 'UN. Paris Agreement. 2015.', grade: 'C (Adequate)', reason: 'Missing treaty series/volume details.' },
      { citation: 'Evans, R. The Coming of the Third Reich. Penguin, 2004.', grade: 'A (Excellent)', reason: 'Perfect MLA book citation.' },
      { citation: 'Rochman, C. Microplastics. EnvSci, 2019.', grade: 'C (Adequate)', reason: 'Missing article title quotes, volume.' }
    ];
    // Pick 4 random pairs for variety
    const shuffled = allPairs.sort(() => Math.random() - 0.5);
    return { pairs: shuffled.slice(0, 4) };
  }

  function generateFillBlankMode() {
    const qs = [
      { sentence: 'A focused RQ uses "______" rather than "How does..."', correct: 'To what extent', options: ['To what extent', 'How does', 'What is', 'Explain'], error: errorDB.rq_broad },
      { sentence: 'MLA citation must include author, title, publisher, and ______.', correct: 'year of publication', options: ['year of publication', 'page count', 'ISBN', 'email'], error: errorDB.citation_format },
      { sentence: 'Academic writing requires a ______ register.', correct: 'formal', options: ['formal', 'casual', 'friendly', 'simple'], error: errorDB.informal_lang },
      { sentence: 'A strong conclusion should ______ findings.', correct: 'synthesize', options: ['synthesize', 'repeat', 'list', 'ignore'], error: errorDB.descriptive_conclusion }
    ];
    return qs[Math.floor(Math.random() * qs.length)];
  }

  function generateTimelineMode() {
    const stmts = [
      { text: 'RQ must appear on the title page.', correct: true },
      { text: 'MLA uses "Works Cited" not "Bibliography".', correct: true },
      { text: 'Page numbers are required for direct quotations.', correct: true },
      { text: 'Contractions are acceptable in formal writing.', correct: false },
      { text: 'Conclusion should introduce new arguments.', correct: false },
      { text: 'Mixing MLA and APA is acceptable.', correct: false }
    ];
    return { statements: stmts.sort(() => Math.random() - 0.5).slice(0, 4) };
  }

  function generateSortingMode() {
    const seqs = [
      [{ text: 'Develop focused RQ', order: 1 },{ text: 'Compile bibliography', order: 2 },{ text: 'Write first draft', order: 3 },{ text: 'Apply citation style', order: 4 },{ text: 'Complete RPPF', order: 5 }],
      [{ text: 'Identify topic', order: 1 },{ text: 'Formulate RQ', order: 2 },{ text: 'Gather sources', order: 3 },{ text: 'Analyze evidence', order: 4 },{ text: 'Proofread', order: 5 }]
    ];
    return { items: seqs[Math.floor(Math.random() * seqs.length)].sort(() => Math.random() - 0.5) };
  }

  // ============ RENDER ============
  function renderCurrentMode() {
    const area = document.getElementById('content-area');
    state.questionData = null; state.answered = false; state.selectedAnswer = null;
    state.matchPairs = {}; state.selectedSource = null; state.sortOrder = []; state.timelineAnswers = {};
    if (state.speedTimer) { clearInterval(state.speedTimer); state.speedTimer = null; }
    if (state.questionsAnswered >= state.totalQuestions) { showGameOverScreen(); return; }
    switch(state.currentMode) {
      case 'compare': renderCompare(area); break;
      case 'sentence': renderSentence(area); break;
      case 'matching': renderMatching(area); break;
      case 'fillblank': renderFillBlank(area); break;
      case 'timeline': renderTimeline(area); break;
      case 'sorting': renderSorting(area); break;
    }
    updateStats();
  }

  function renderCompare(area) {
    const d = generateCompareMode(); state.questionData = d;
    let h = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div><div class="question-card"><div class="question-header">ESSAY COMPARISON</div>`;
    d.options.forEach((o,i) => h += `<div class="essay-box" id="essay-${i}" onclick="selectEssay(${i})"><b>ESSAY ${String.fromCharCode(65+i)}</b><br>${o.html}</div>`);
    h += `<div class="btn-group"><button class="btn btn-primary" onclick="submitCompare()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = h;
  }

  function renderSentence(area) {
    const d = generateSentenceMode(); state.questionData = d;
    let h = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div><div class="question-card"><div class="question-header">SENTENCE HUNT: ${d.error.name}</div>`;
    d.sentences.forEach((s,i) => h += `<div class="sentence-item" id="sentence-${i}" onclick="selectSentence(${i})"><b>${i+1}.</b> ${s.text}</div>`);
    h += `<div class="btn-group"><button class="btn btn-primary" onclick="submitSentence()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = h;
  }

  function renderMatching(area) {
    const d = generateMatchingMode(); state.questionData = d;
    let h = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div><div class="question-card"><div class="question-header">CITATION MATCHING</div><div class="matching-grid"><div><b>SOURCES</b><div id="sources-list">`;
    d.pairs.forEach((p,i) => h += `<div class="match-item" id="source-${i}" onclick="selectSource(${i})">${p.citation}</div>`);
    h += `</div></div><div><b>GRADES</b><div id="grades-list">`;
    const shuffled = d.pairs.map(p => ({grade:p.grade, reason:p.reason})).sort(()=>Math.random()-0.5);
    state.questionData.shuffledGrades = shuffled;
    shuffled.forEach((g,i) => {
      const gc = g.grade.includes('A')?'grade-a':g.grade.includes('B')?'grade-b':g.grade.includes('C')?'grade-c':'grade-d';
      h += `<div class="match-item" id="grade-${i}" onclick="selectGrade(${i})"><span class="grade-badge ${gc}">${g.grade}</span> ${g.reason}</div>`;
    });
    h += `</div></div></div><div class="btn-group"><button class="btn btn-primary" onclick="submitMatching()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = h;
  }

  function renderFillBlank(area) {
    const d = generateFillBlankMode(); state.questionData = d;
    let h = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div><div class="question-card"><div class="question-header">FILL IN THE BLANK</div><div class="essay-box">${d.sentence.replace('______','<span style="border-bottom:2px solid #e94560; color:#e94560;">______</span>')}</div><div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px;">`;
    d.options.forEach((o,i) => h += `<div class="sentence-item" id="blank-option-${i}" onclick="selectBlankOption(${i})">${o}</div>`);
    h += `</div><div class="btn-group"><button class="btn btn-primary" onclick="submitFillBlank()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = h;
  }

  function renderTimeline(area) {
    const d = generateTimelineMode(); state.questionData = d; state.speedTimeLeft = 30; state.timelineAnswers = {};
    let h = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div><div class="question-card"><div class="question-header">SPEED ROUND (30s)</div><div style="text-align:center; font-size:28px; color:#ff4444;" id="speed-timer">30</div>`;
    d.statements.forEach((s,i) => h += `<div class="essay-box" id="timeline-${i}"><p>${s.text}</p><div class="btn-group"><button class="btn btn-primary" onclick="answerTimeline(${i},true)">CORRECT</button><button class="btn btn-secondary" onclick="answerTimeline(${i},false)">INCORRECT</button></div></div>`);
    h += `</div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = h; startSpeedTimer();
  }

  function renderSorting(area) {
    const d = generateSortingMode(); state.questionData = d;
    let h = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div><div class="question-card"><div class="question-header">RANK ORDER</div>`;
    d.items.forEach((item,i) => h += `<div class="essay-box" id="sort-item-${i}" onclick="selectSortItem(${i})"><span id="sort-number-${i}">#?</span> ${item.text}</div>`);
    h += `<div class="btn-group"><button class="btn btn-primary" onclick="submitSorting()">SUBMIT</button><button class="btn btn-secondary" onclick="resetSorting()">RESET</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = h;
  }

  // ============ HANDLERS ============
  function selectEssay(i) { if(state.answered) return; document.querySelectorAll('.essay-box').forEach(e=>e.classList.remove('selected')); document.getElementById('essay-'+i).classList.add('selected'); state.selectedAnswer=i; }
  function selectSentence(i) { if(state.answered) return; document.querySelectorAll('.sentence-item').forEach(e=>e.classList.remove('selected')); document.getElementById('sentence-'+i).classList.add('selected'); state.selectedAnswer=i; }
  function selectSource(i) { if(state.answered) return; document.querySelectorAll('#sources-list .match-item').forEach(e=>e.classList.remove('selected')); document.getElementById('source-'+i).classList.add('selected'); state.selectedSource=i; }
  function selectGrade(i) { if(state.answered || state.selectedSource===null) return;
    Object.keys(state.matchPairs).forEach(k=>{ if(state.matchPairs[k]===i){ delete state.matchPairs[k]; document.getElementById('grade-'+i).classList.remove('matched'); document.getElementById('source-'+k).classList.remove('matched'); } });
    state.matchPairs[state.selectedSource]=i; document.getElementById('grade-'+i).classList.add('matched'); document.getElementById('source-'+state.selectedSource).classList.add('matched'); state.selectedSource=null; }
  function selectBlankOption(i) { if(state.answered) return; document.querySelectorAll('[id^="blank-option-"]').forEach(e=>e.classList.remove('selected')); document.getElementById('blank-option-'+i).classList.add('selected'); state.selectedAnswer=i; }
  function answerTimeline(i,ans) { if(state.answered||state.timelineAnswers[i]!==undefined) return; state.timelineAnswers[i]=ans; document.getElementById('timeline-'+i).style.opacity='0.6'; if(Object.keys(state.timelineAnswers).length===state.questionData.statements.length) submitTimeline(); }
  function selectSortItem(i) { if(state.answered) return; if(state.sortOrder.includes(i)) state.sortOrder=state.sortOrder.filter(x=>x!==i); else state.sortOrder.push(i); updateSortDisplay(); }
  function updateSortDisplay() { document.querySelectorAll('[id^="sort-item-"]').forEach(el=>{ let idx=parseInt(el.id.split('-')[2]); let pos=state.sortOrder.indexOf(idx); document.getElementById('sort-number-'+idx).textContent = pos>=0 ? '#'+(pos+1) : '#?'; }); }
  function resetSorting() { state.sortOrder=[]; updateSortDisplay(); }

  function skipQuestion() {
    if (state.speedTimer) clearInterval(state.speedTimer);
    state.questionsAnswered++; state.modeQuestionCount[state.currentMode]++;
    if (state.questionsAnswered >= state.totalQuestions) { showGameOverScreen(); return; }
    renderCurrentMode();
  }

  function submitCompare() {
    if(state.answered||state.selectedAnswer===null) return;
    state.answered=true; const correct=state.selectedAnswer===state.questionData.correctIdx;
    processResult(correct); document.querySelectorAll('.essay-box').forEach(el=>{ let i=parseInt(el.id.split('-')[1]); if(i===state.questionData.correctIdx) el.classList.add('correct'); else if(i===state.selectedAnswer&&!correct) el.classList.add('incorrect'); });
    showFeedback(correct, state.questionData.options[state.questionData.correctIdx].errors);
  }
  function submitSentence() {
    if(state.answered||state.selectedAnswer===null) return;
    state.answered=true; const correct=state.selectedAnswer===state.questionData.errorPos;
    processResult(correct); document.getElementById('sentence-'+state.questionData.errorPos).classList.add('correct'); if(!correct) document.getElementById('sentence-'+state.selectedAnswer).classList.add('incorrect');
    showFeedback(correct, [state.questionData.error]);
  }
  function submitMatching() {
    if(state.answered||Object.keys(state.matchPairs).length<state.questionData.pairs.length) return;
    state.answered=true; let correctCount=0; const details = [];
    state.questionData.pairs.forEach((p,i)=>{
      const matched = state.questionData.shuffledGrades[state.matchPairs[i]];
      const isCorrect = matched?.grade === p.grade;
      if(isCorrect) correctCount++;
      details.push({ citation: p.citation, correctGrade: p.grade, userGrade: matched?.grade || 'None', reason: p.reason, isCorrect });
    });
    processResult(correctCount===state.questionData.pairs.length);
    showMatchingFeedback(correctCount, details);
  }
  function submitFillBlank() {
    if(state.answered||state.selectedAnswer===null) return;
    state.answered=true; const correct=state.questionData.options[state.selectedAnswer]===state.questionData.correct;
    processResult(correct); showFeedback(correct, [state.questionData.error]);
  }
  function submitTimeline() {
    if(state.answered) return; state.answered=true; if(state.speedTimer) clearInterval(state.speedTimer);
    let correctCount=0; state.questionData.statements.forEach((s,i)=>{ if(state.timelineAnswers[i]===s.correct) correctCount++; });
    processResult(correctCount===state.questionData.statements.length);
    document.getElementById('speed-timer').textContent='DONE'; showFeedback(correctCount===state.questionData.statements.length, [], `Speed: ${correctCount}/${state.questionData.statements.length}`);
  }
  function submitSorting() {
    if(state.answered||state.sortOrder.length!==state.questionData.items.length) return;
    state.answered=true; let correct=true; state.sortOrder.forEach((idx,pos)=>{ if(state.questionData.items[idx].order!==pos+1) correct=false; });
    processResult(correct); showSortingFeedback(correct);
  }

  function processResult(correct) {
    state.questionsAnswered++; state.modeQuestionCount[state.currentMode]++;
    if(correct) { state.correctAnswers++; state.streak++; state.score+=10+state.streak*2; }
    else { state.streak=0; state.score=Math.max(0,state.score-5); }
    updateStats();
    if (state.questionsAnswered >= state.totalQuestions) setTimeout(showGameOverScreen, 1000);
  }

  function showFeedback(correct, errors, customMsg) {
    const panel=document.getElementById('feedback-panel'); let h=`<h4 style="color:${correct?'#00cc66':'#ff4444'};">${correct?'CORRECT':'INCORRECT'}</h4>`;
    if(customMsg) h+=`<p>${customMsg}</p>`;
    if(errors?.length) errors.forEach(e=>h+=`<div class="error-item"><span class="grade-badge grade-d">${e.name}</span> ${e.explanation} <span style="color:#00cc66;">Fix: ${e.fix}</span></div>`);
    h+=`<div class="btn-group"><button class="btn btn-primary" onclick="if(state.questionsAnswered>=state.totalQuestions)showGameOverScreen(); else renderCurrentMode();">NEXT</button></div>`;
    panel.innerHTML=h; panel.classList.add('visible'); panel.scrollIntoView({behavior:'smooth'});
  }

  function showMatchingFeedback(correctCount, details) {
    const panel=document.getElementById('feedback-panel');
    let h = `<h4 style="color:${correctCount===details.length?'#00cc66':'#ff9933'};">${correctCount}/${details.length} CORRECT MATCHES</h4>`;
    details.forEach(d => {
      const gc = d.correctGrade.includes('A')?'grade-a':d.correctGrade.includes('B')?'grade-b':d.correctGrade.includes('C')?'grade-c':'grade-d';
      h += `<div class="error-item" style="border-left-color:${d.isCorrect?'#00cc66':'#ff4444'};">
        <span class="grade-badge ${gc}">${d.correctGrade}</span> <b>${d.citation.substring(0,45)}...</b>
        <p style="margin-top:3px;"><b>Reason:</b> ${d.reason}</p>
        ${!d.isCorrect ? `<p style="color:#ff4444;">Your match: ${d.userGrade}</p>` : ''}
      </div>`;
    });
    h += `<button class="btn btn-primary" onclick="renderCurrentMode()">NEXT</button>`;
    panel.innerHTML = h; panel.classList.add('visible'); panel.scrollIntoView({behavior:'smooth'});
  }

  function showSortingFeedback(correct) {
    const panel=document.getElementById('feedback-panel');
    panel.innerHTML=`<h4>${correct?'✅ Correct Order':'❌ Incorrect'}</h4><button class="btn btn-primary" onclick="renderCurrentMode()">NEXT</button>`;
    panel.classList.add('visible');
  }

  function startSpeedTimer() {
    state.speedTimeLeft=30; state.speedTimer=setInterval(()=>{ state.speedTimeLeft--; const el=document.getElementById('speed-timer'); if(el){ el.textContent=state.speedTimeLeft; if(state.speedTimeLeft<=10) el.style.color='#ff0000'; } if(state.speedTimeLeft<=0){ clearInterval(state.speedTimer); if(!state.answered) submitTimeline(); } },1000);
  }

  function updateStats() {
    document.getElementById('score-display').textContent=state.score;
    document.getElementById('streak-display').textContent=state.streak;
    document.getElementById('question-display').textContent=state.questionsAnswered+'/'+state.totalQuestions;
    document.getElementById('accuracy-display').textContent=state.questionsAnswered?Math.round((state.correctAnswers/state.questionsAnswered)*100)+'%':'0%';
    document.getElementById('time-display').textContent=formatTime(state.globalTime);
  }

  function formatTime(s) { const m=Math.floor(s/60); const sec=s%60; return m+':'+(sec<10?'0':'')+sec; }

  // ============ GAME OVER & LEADERBOARD ============
  function showGameOverScreen() {
    if (state.gameEnded) return;
    state.gameEnded = true;
    if (state.speedTimer) clearInterval(state.speedTimer);
    const area = document.getElementById('content-area');
    const accuracy = state.questionsAnswered ? Math.round((state.correctAnswers/state.questionsAnswered)*100) : 0;
    let html = `<div class="leaderboard"><h2>🏆 SESSION COMPLETE</h2><p style="margin:6px 0;">Score: <b style="color:#e94560; font-size:18px;">${state.score}</b> | Accuracy: ${accuracy}%</p>
      <div class="input-group"><label style="color:#c0c0c0;">INITIALS:</label><input type="text" id="initials-input" class="initials-input" maxlength="3" placeholder="ABC" autocomplete="off"><button class="btn btn-primary" onclick="submitInitials()">SAVE</button></div>
      <p id="initials-error" style="color:#ff4444; display:none; font-size:11px;">1-3 letters required.</p></div><div id="persistent-leaderboard"></div>`;
    area.innerHTML = html;
    renderPersistentLeaderboard();
  }

  function submitInitials() {
    const input = document.getElementById('initials-input');
    const errorEl = document.getElementById('initials-error');
    const initials = input.value.trim().toUpperCase();
    if (!/^[A-Z]{1,3}$/.test(initials)) { errorEl.style.display='block'; input.focus(); return; }
    errorEl.style.display='none'; state.playerInitials = initials;
    const entry = { initials, score: state.score, accuracy: state.questionsAnswered?Math.round((state.correctAnswers/state.questionsAnswered)*100):0, time: formatTime(state.globalTime), date: new Date().toLocaleDateString() };
    const persistent = loadPersistentLeaderboard(); persistent.push(entry); savePersistentLeaderboard(persistent);
    renderPersistentLeaderboard(initials);
    input.disabled = true; document.querySelector('.input-group .btn-primary').disabled = true; document.querySelector('.input-group .btn-primary').textContent = 'SAVED ✓';
  }

  function renderPersistentLeaderboard(highlightInitials = null) {
    const container = document.getElementById('persistent-leaderboard');
    if (!container) return;
    const persistent = loadPersistentLeaderboard();
    if (persistent.length === 0) { container.innerHTML = '<div class="leaderboard"><p>No scores yet.</p></div>'; return; }
    let html = `<div class="leaderboard"><h2>📜 ALL-TIME LEADERS</h2><p class="subtitle">Top ${persistent.length}</p>`;
    persistent.forEach((entry, index) => {
      const isHighlight = highlightInitials && entry.initials === highlightInitials && entry.score === state.score;
      html += `<div class="leaderboard-entry ${isHighlight?'highlight':''}"><span class="leaderboard-rank">#${index+1}</span><span class="leaderboard-initials">${entry.initials}</span><span>Score: <span class="leaderboard-score">${entry.score}</span></span><span>Acc: ${entry.accuracy}%</span><span style="font-size:10px;">${entry.time}</span><span style="font-size:9px; color:#666;">${entry.date||''}</span></div>`;
    });
    html += `<button class="btn btn-primary" style="margin-top:10px;" onclick="resetGame()">PLAY AGAIN</button><button class="clear-scores-btn" onclick="clearAllScores()">🗑️ CLEAR</button></div>`;
    container.innerHTML = html;
  }

  function clearAllScores() { if(confirm('Delete all saved scores?')) { localStorage.removeItem(STORAGE_KEY); renderPersistentLeaderboard(); } }

  function resetGame() {
    state.score=0; state.questionsAnswered=0; state.streak=0; state.correctAnswers=0; state.globalTime=0;
    state.modeTimers={compare:0,sentence:0,matching:0,fillblank:0,timeline:0,sorting:0};
    state.modeQuestionCount={compare:0,sentence:0,matching:0,fillblank:0,timeline:0,sorting:0};
    state.gameEnded=false; state.playerInitials=null;
    document.getElementById('leaderboard-container').innerHTML='';
    document.getElementById('content-area').innerHTML='';
    clearInterval(state.modeIntervalId); startModeTimerInterval(); renderCurrentMode();
  }

  function startModeTimerInterval() {
    if(state.modeIntervalId) clearInterval(state.modeIntervalId);
    state.modeIntervalId = setInterval(() => {
      if(state.gameEnded) return;
      state.globalTime++; state.modeTimers[state.currentMode]++;
      document.getElementById('time-display').textContent = formatTime(state.globalTime);
      const el = document.getElementById('timer-'+state.currentMode);
      if(el) el.textContent = formatTime(state.modeTimers[state.currentMode]);
    }, 1000);
  }

  document.getElementById('mode-nav').addEventListener('click', function(e) {
    const btn = e.target.closest('.mode-btn');
    if (!btn || state.gameEnded) return;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.currentMode = btn.dataset.mode;
    if(state.speedTimer) { clearInterval(state.speedTimer); state.speedTimer = null; }
    if(state.questionsAnswered >= state.totalQuestions) { showGameOverScreen(); return; }
    renderCurrentMode();
  });

  document.addEventListener('keydown', function(e) {
    if(state.gameEnded) { if(e.key==='Enter'){ const inp=document.getElementById('initials-input'); if(inp&&document.activeElement===inp) submitInitials(); } return; }
    if(state.answered) { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(state.questionsAnswered>=state.totalQuestions) showGameOverScreen(); else renderCurrentMode(); } return; }
    const num = parseInt(e.key);
    if(num>=1&&num<=4){ e.preventDefault(); const i=num-1; switch(state.currentMode){ case'compare':selectEssay(i);break; case'sentence':selectSentence(i);break; case'fillblank':selectBlankOption(i);break; } }
    if(e.key==='Enter'){ e.preventDefault(); switch(state.currentMode){ case'compare':submitCompare();break; case'sentence':submitSentence();break; case'matching':submitMatching();break; case'fillblank':submitFillBlank();break; case'sorting':submitSorting();break; } }
  });

  startModeTimerInterval(); renderCurrentMode(); updateStats();
</script>

</body>
</html>
