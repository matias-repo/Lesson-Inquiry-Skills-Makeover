<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>IB EE Examiner Training Suite v4.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      color: #e0e0e0;
      padding: 12px;
      min-height: 100vh;
    }

    .main-container {
      max-width: 1000px;
      margin: 0 auto;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 16px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(180deg, #0f3460, #16213e);
      padding: 24px;
      text-align: center;
      border-bottom: 3px solid #e94560;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 800;
      color: #e94560;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .header .subtitle {
      font-size: 15px;
      color: #a0a0a0;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      padding: 16px;
      background: #0f3460;
      border-bottom: 2px solid #1a1a4e;
    }

    .stat-item {
      background: #16213e;
      padding: 12px 6px;
      border-radius: 8px;
      border: 1px solid #1a1a4e;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .stat-value {
      font-size: 26px;
      color: #e94560;
      font-weight: 800;
      margin-top: 2px;
    }

    .mode-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px;
      background: #0a0a1a;
      border-bottom: 2px solid #1a1a4e;
      justify-content: center;
    }

    .mode-btn {
      padding: 12px 18px;
      background: #16213e;
      border: 1px solid #1a1a4e;
      color: #c0c0c0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 8px;
      transition: all 0.25s;
      position: relative;
    }

    .mode-btn:hover {
      background: #0f3460;
      border-color: #e94560;
      color: #e94560;
      transform: translateY(-1px);
    }

    .mode-btn.active {
      background: #e94560;
      color: white;
      border-color: #c23152;
      box-shadow: 0 0 25px rgba(233,69,96,0.5);
    }

    .mode-btn .mode-timer {
      display: block;
      font-size: 11px;
      color: #ffaa00;
      margin-top: 4px;
      font-weight: 400;
    }

    .content-area {
      padding: 24px;
      min-height: 550px;
      background: #0d1b2e;
    }

    .progress-bar {
      height: 10px;
      background: #0a0a1a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      transition: width 0.4s ease;
      border-radius: 6px;
    }

    .question-card {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .question-header {
      font-size: 20px;
      font-weight: 800;
      color: #e94560;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #0f3460;
      letter-spacing: 0.5px;
    }

    .essay-box {
      background: #0a0a1a;
      border: 2px solid #1a1a4e;
      border-radius: 10px;
      padding: 22px;
      margin: 12px 0;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      line-height: 1.8;
      color: #e0e0e0;
    }

    .essay-box:hover {
      border-color: #e94560;
      background: #12122a;
      transform: scale(1.01);
    }

    .essay-box.selected {
      border-color: #e94560;
      background: #1a0a1a;
      box-shadow: 0 0 20px rgba(233,69,96,0.4);
    }

    .essay-box.correct {
      border-color: #00cc66;
      background: #0a1a0a;
    }

    .essay-box.incorrect {
      border-color: #ff4444;
      background: #1a0a0a;
    }

    .essay-label {
      font-weight: 800;
      color: #e94560;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .essay-section {
      margin-bottom: 14px;
    }

    .essay-section h4 {
      color: #ff6b6b;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .essay-section p {
      margin-left: 10px;
      color: #c0c0c0;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #e94560;
      color: white;
    }

    .btn-primary:hover {
      background: #c23152;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #0f3460;
      color: white;
    }

    .btn-secondary:hover {
      background: #1a4a7a;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
    }

    .feedback-panel {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
      display: none;
      animation: fadeIn 0.3s;
    }

    .feedback-panel.visible {
      display: block;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .error-item {
      background: #0a0a1a;
      border-left: 5px solid #e94560;
      padding: 14px;
      margin: 10px 0;
      border-radius: 6px;
    }

    .grade-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 8px;
    }

    .grade-a { background: #00cc66; color: white; }
    .grade-b { background: #33cc33; color: white; }
    .grade-c { background: #ff9933; color: white; }
    .grade-d { background: #ff4444; color: white; }

    .sentence-item {
      background: #0a0a1a;
      border: 2px solid #1a1a4e;
      border-radius: 8px;
      padding: 16px;
      margin: 10px 0;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.6;
      transition: all 0.2s;
    }

    .sentence-item:hover {
      border-color: #e94560;
      background: #12122a;
    }

    .sentence-item.selected {
      border-color: #e94560;
      background: #1a0a1a;
    }

    .matching-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .match-item {
      background: #0a0a1a;
      border: 2px solid #1a1a4e;
      border-radius: 8px;
      padding: 14px;
      margin: 8px 0;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .match-item.selected {
      border-color: #e94560;
    }

    .match-item.matched {
      border-color: #00cc66;
      background: #0a1a0a;
    }

    .leaderboard {
      background: #0f1629;
      border: 2px solid #e94560;
      border-radius: 14px;
      padding: 24px;
      margin: 24px 0;
      text-align: center;
    }

    .leaderboard h2 {
      color: #e94560;
      margin-bottom: 16px;
      font-size: 26px;
    }

    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16213e;
      margin: 6px 0;
      border-radius: 8px;
      font-weight: 600;
    }

    @media (max-width: 650px) {
      .header h1 { font-size: 22px; }
      .essay-box { font-size: 13px; padding: 14px; }
      .matching-grid { grid-template-columns: 1fr; }
      .mode-btn { padding: 10px 12px; font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="header">
    <h1>IB EE Examiner Training Suite</h1>
    <div class="subtitle">Professional Assessment Tool v4.0 · Enhanced Edition</div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div>LEVEL</div><div class="stat-value" id="level-display">1</div></div>
    <div class="stat-item"><div>SCORE</div><div class="stat-value" id="score-display">0</div></div>
    <div class="stat-item"><div>STREAK</div><div class="stat-value" id="streak-display">0</div></div>
    <div class="stat-item"><div>ACCURACY</div><div class="stat-value" id="accuracy-display">0%</div></div>
    <div class="stat-item"><div>QUESTIONS</div><div class="stat-value" id="question-display">0/25</div></div>
    <div class="stat-item"><div>GLOBAL TIME</div><div class="stat-value" id="time-display">0:00</div></div>
  </div>

  <div class="mode-nav" id="mode-nav">
    <button class="mode-btn active" data-mode="compare">📝 Essay Compare <span class="mode-timer" id="timer-compare">0:00</span></button>
    <button class="mode-btn" data-mode="sentence">🔍 Sentence Hunt <span class="mode-timer" id="timer-sentence">0:00</span></button>
    <button class="mode-btn" data-mode="matching">📎 Cite Match <span class="mode-timer" id="timer-matching">0:00</span></button>
    <button class="mode-btn" data-mode="fillblank">✍️ Fill Blank <span class="mode-timer" id="timer-fillblank">0:00</span></button>
    <button class="mode-btn" data-mode="timeline">⏳ Speed Round <span class="mode-timer" id="timer-timeline">0:00</span></button>
    <button class="mode-btn" data-mode="sorting">🔢 Rank Order <span class="mode-timer" id="timer-sorting">0:00</span></button>
  </div>

  <div class="content-area" id="content-area"></div>
  <div id="leaderboard-container" style="padding: 0 24px 24px;"></div>
</div>

<script>
  // ============ GAME STATE v4.0 ============
  const state = {
    score: 0,
    questionsAnswered: 0,
    totalQuestions: 25,            // Fixed total questions across all modes
    streak: 0,
    correctAnswers: 0,
    level: 1,
    globalTime: 0,
    currentMode: 'compare',
    modeTimers: { compare: 0, sentence: 0, matching: 0, fillblank: 0, timeline: 0, sorting: 0 },
    modeQuestionCount: { compare: 0, sentence: 0, matching: 0, fillblank: 0, timeline: 0, sorting: 0 },
    questionData: null,
    answered: false,
    selectedAnswer: null,
    speedTimer: null,
    speedTimeLeft: 0,
    matchPairs: {},
    selectedSource: null,
    sortOrder: [],
    timelineAnswers: {},
    leaderboard: [],              // Store recent results
    modeIntervalId: null
  };

  // ============ EXPANDED ESSAY DATABASE (MORE VARIETY) ============
  const essayDB = [
    {
      id: 'eng1', subject: 'English A: Literature',
      rq: 'To what extent does Virginia Woolf\'s use of free indirect discourse in Mrs Dalloway influence the reader\'s perception of time and consciousness?',
      candidate: '004512-0032', session: 'May 2024',
      intro: 'This extended essay examines the narrative technique of free indirect discourse in Virginia Woolf\'s modernist novel Mrs Dalloway (1925). The investigation focuses on how Woolf\'s manipulation of narrative perspective fundamentally alters the reader\'s experience of temporality and psychological interiority.',
      analysis: 'Through close reading of key passages—including Clarissa Dalloway\'s morning walk through London and Septimus Warren Smith\'s fragmented perceptions in Regent\'s Park—this analysis demonstrates how Woolf\'s seamless movement between third-person narration and characters\' internal thoughts creates what Paul Ricoeur terms "narrative time."',
      conclusion: 'The investigation concludes that Woolf\'s innovative use of free indirect discourse is central to her modernist project of representing consciousness, inviting readers to inhabit multiple temporal planes simultaneously.',
      works: ['Woolf, Virginia. Mrs Dalloway. Hogarth Press, 1925.', 'Genette, Gérard. Narrative Discourse. Cornell UP, 1980.', 'Ricoeur, Paul. Time and Narrative, Vol 2. U of Chicago Press, 1985.']
    },
    {
      id: 'geo1', subject: 'Geography',
      rq: 'To what extent have international climate agreements been effective in reducing carbon emissions among signatory nations since 1997?',
      candidate: '007821-0045', session: 'November 2023',
      intro: 'This geography extended essay evaluates the measurable impact of the Kyoto Protocol (1997) and the Paris Agreement (2015) on national carbon emission trajectories.',
      analysis: 'Quantitative data from the World Bank and IPCC (2022) reveals a 23% reduction in EU emissions between 1990-2020, while India\'s emissions increased by 14%. Legally binding targets proved more effective than voluntary NDCs.',
      conclusion: 'The evidence demonstrates that international agreements\' effectiveness is contingent upon binding enforcement mechanisms and equitable burden-sharing provisions.',
      works: ['IPCC. Climate Change 2022: Mitigation of Climate Change. Cambridge UP, 2022.', 'United Nations. Paris Agreement. Treaty Series, vol. 3156, 2015.', 'World Bank. Carbon Pricing 2023. World Bank, 2023.']
    },
    {
      id: 'phil1', subject: 'Philosophy',
      rq: 'To what extent can John Searle\'s Chinese Room argument be considered a decisive refutation of strong artificial intelligence?',
      candidate: '003409-0018', session: 'May 2025',
      intro: 'This philosophy extended essay critically evaluates the logical force of Searle\'s Chinese Room thought experiment against strong AI claims.',
      analysis: 'Searle\'s distinction between syntactic manipulation and semantic understanding challenges functionalism, but Dennett\'s systems reply suggests the argument relies on intuitive yet questionable assumptions about understanding.',
      conclusion: 'While the Chinese Room highlights the difference between simulation and genuine understanding, it does not constitute a decisive refutation, particularly given advances in neural networks.',
      works: ['Searle, John. "Minds, Brains, and Programs." Behavioral and Brain Sciences, vol.3, 1980.', 'Dennett, Daniel. Consciousness Explained. Little Brown, 1991.', 'Bostrom, Nick. Superintelligence. Oxford UP, 2014.']
    },
    {
      id: 'hist1', subject: 'History',
      rq: 'To what extent did the Treaty of Versailles contribute to the rise of extremist political movements in Germany between 1919 and 1933?',
      candidate: '009234-0056', session: 'November 2024',
      intro: 'This history extended essay investigates the causal relationship between the punitive terms of the Treaty of Versailles and the subsequent radicalization of German politics.',
      analysis: 'Analysis of economic data and political speeches reveals that war reparations and territorial losses created economic instability exploited by extremist parties. However, the essay also considers other contributing factors such as the Weimar Constitution\'s weaknesses.',
      conclusion: 'The Treaty of Versailles was a significant but not exclusive factor in the rise of extremism; its psychological impact on national identity was as crucial as its economic consequences.',
      works: ['Keynes, John M. The Economic Consequences of the Peace. Macmillan, 1919.', 'Evans, Richard. The Coming of the Third Reich. Penguin, 2004.', 'Marks, Sally. The Illusion of Peace. Palgrave, 2003.']
    },
    {
      id: 'bio1', subject: 'Biology',
      rq: 'To what extent does the concentration of microplastics in freshwater ecosystems correlate with the decline of Daphnia magna populations?',
      candidate: '001256-0078', session: 'May 2026',
      intro: 'This biology extended essay examines the ecotoxicological effects of microplastic pollution on a keystone freshwater species through controlled laboratory experiments.',
      analysis: 'Experimental data shows a statistically significant negative correlation (r = -0.82) between microplastic concentration and Daphnia magna filtration rates. Concentrations above 50 particles/mL led to 40% mortality within 72 hours.',
      conclusion: 'Microplastics pose a demonstrable threat to freshwater filter feeders, with implications for entire aquatic food webs, though field conditions may moderate laboratory findings.',
      works: ['Rochman, C. "Microplastics in Freshwater." Environmental Science, vol.45, 2019.', 'OECD. Guidelines for Testing of Chemicals. OECD, 2020.', 'WHO. Microplastics in Drinking Water. WHO, 2022.']
    }
  ];

  // ============ ERROR DEFINITIONS (EXPANDED) ============
  const errorDB = {
    rq_broad: { name: 'Overly Broad Research Question', criterion: 'A', grade: 'D', explanation: 'Lacks specificity for a 4000-word investigation. Must be sharply focused.', fix: 'Add specific context and analytical framing.' },
    informal_lang: { name: 'Informal Academic Register', criterion: 'B', grade: 'D', explanation: 'Uses colloquial language inappropriate for academic writing.', fix: 'Replace informal phrases with academic equivalents.' },
    citation_format: { name: 'Inconsistent Citation Formatting', criterion: 'D', grade: 'C', explanation: 'Citations mix different styles or contain inconsistencies.', fix: 'Choose one citation style and apply consistently.' },
    descriptive_conclusion: { name: 'Descriptive Conclusion', criterion: 'C', grade: 'D', explanation: 'Conclusion summarizes rather than synthesizing findings.', fix: 'Directly address the research question with analytical evaluation.' },
    missing_pages: { name: 'Missing Page Numbers', criterion: 'D', grade: 'C', explanation: 'Direct quotations lack page numbers, weakening credibility.', fix: 'Include page numbers for all quotations.' },
    weak_topic: { name: 'Weak Topic Sentences', criterion: 'C', grade: 'D', explanation: 'Paragraphs begin with facts instead of analytical claims.', fix: 'Start paragraphs with arguments, then support with evidence.' },
    vague_analysis: { name: 'Vague Analytical Language', criterion: 'C', grade: 'D', explanation: 'Uses imprecise terms like "good" or "important" without defining criteria.', fix: 'Use subject-specific terminology and quantify where possible.' }
  };

  // ============ BUILD PERFECT ESSAY HTML ============
  function buildPerfectEssay(essay) {
    return `
      <div class="essay-label">Title Page</div>
      <div class="essay-section"><p><b>RQ:</b> ${essay.rq}</p><p><b>Subject:</b> ${essay.subject}</p><p><b>Candidate:</b> ${essay.candidate}</p></div>
      <hr style="border:1px solid #1a1a4e; margin:10px 0;">
      <div class="essay-section"><h4>Introduction</h4><p>${essay.intro}</p></div>
      <div class="essay-section"><h4>Analysis</h4><p>${essay.analysis}</p></div>
      <div class="essay-section"><h4>Conclusion</h4><p>${essay.conclusion}</p></div>
      <div class="essay-section"><h4>Works Cited</h4>${essay.works.map(w => `<p>${w}</p>`).join('')}</div>
    `;
  }

  function applyError(html, essay, errorKey) {
    switch(errorKey) {
      case 'rq_broad': return html.replace(essay.rq, 'How does literature affect people?');
      case 'informal_lang': return html.replace('examines', 'looks at').replace('fundamentally alters', 'really changes').replace('concludes', 'says');
      case 'citation_format': return html.replace('Hogarth Press, 1925.', 'Hogarth Press, 1925 (no italics).').replace('Cambridge UP, 2022.', 'cambridge university press 2022.');
      case 'descriptive_conclusion': return html.replace(essay.conclusion, 'In conclusion, this essay discussed many aspects. More research is needed.');
      case 'missing_pages': return html.replace('vol. 3, no. 3, 1980, pp. 417-457.', 'vol. 3, no. 3, 1980.');
      case 'weak_topic': return html.replace(essay.analysis.substring(0, 80), 'This topic is very interesting and has been studied by many people.');
      case 'vague_analysis': return html.replace('statistically significant', 'pretty big').replace('demonstrates', 'shows');
      default: return html;
    }
  }

  // ============ MODE GENERATORS (WITH MORE VARIATION) ============
  function generateCompareMode() {
    const essay = essayDB[Math.floor(Math.random() * essayDB.length)];
    const numOptions = 3;
    const correctIdx = Math.floor(Math.random() * numOptions);
    let options = [];
    for (let i = 0; i < numOptions; i++) {
      if (i === correctIdx) {
        options.push({ html: buildPerfectEssay(essay), correct: true, errors: [] });
      } else {
        const errorKeys = Object.keys(errorDB).sort(() => Math.random() - 0.5).slice(0, 2 + Math.floor(Math.random() * 3));
        let html = buildPerfectEssay(essay);
        const errors = [];
        errorKeys.forEach(key => { html = applyError(html, essay, key); errors.push(errorDB[key]); });
        options.push({ html, correct: false, errors });
      }
    }
    return { essay, options, correctIdx };
  }

  function generateSentenceMode() {
    const errorKey = Object.keys(errorDB)[Math.floor(Math.random() * Object.keys(errorDB).length)];
    const error = errorDB[errorKey];
    const errorSentences = {
      rq_broad: 'Research Question: How does literature affect how people think and feel?',
      informal_lang: "This essay will look at how the author's technique really changes things.",
      citation_format: 'Works Cited: Woolf, V. (1925) Mrs Dalloway. Hogarth Press. Genette, G. Narrative Discourse. Cornell UP, 1980.',
      descriptive_conclusion: 'In conclusion, this essay discussed many aspects and considered various viewpoints.',
      missing_pages: 'As Woolf demonstrates, "she had the perpetual sense of being out at sea" (Woolf, 1925).',
      weak_topic: 'Virginia Woolf was born in 1882 and wrote many famous novels.',
      vague_analysis: 'The results were really good and showed a big change in the data.'
    };
    const correctSentences = [
      'The analysis reveals a fluid temporality that mirrors human thought processes (Ricoeur, 1985, p. 102).',
      'Quantitative data reveals a 23% reduction in EU emissions between 1990 and 2020 (IPCC, 2022).',
      'Genette\'s framework distinguishes between narrative voice and focalization (Genette, 1980, pp. 185-189).',
      'Searle\'s distinction challenges functionalist theories of artificial intelligence (Searle, 1980, p. 422).',
      'Legally binding targets were substantially more effective than voluntary contributions.',
      'Woolf\'s free indirect discourse restructures the reader\'s temporal experience of the narrative.',
      'The Treaty\'s psychological impact on national identity was as crucial as its economic consequences.',
      'Microplastic concentration negatively correlated with filtration rates (r = -0.82, p < 0.01).'
    ];
    const sentences = [];
    const errorPos = Math.floor(Math.random() * 4);
    const shuffledCorrect = correctSentences.sort(() => Math.random() - 0.5);
    for (let i = 0; i < 4; i++) {
      if (i === errorPos) sentences.push({ text: errorSentences[errorKey], hasError: true, error });
      else sentences.push({ text: shuffledCorrect[i] || shuffledCorrect[0], hasError: false, error: null });
    }
    return { sentences, errorPos, error };
  }

  function generateMatchingMode() {
    const pairs = [
      { citation: 'Woolf, V. Mrs Dalloway. Hogarth Press, 1925.', grade: 'A (Excellent)', reason: 'Complete MLA format.' },
      { citation: 'Woolf, V. mrs dalloway. hogarth press, 1925', grade: 'D (Poor)', reason: 'Capitalization errors.' },
      { citation: 'Genette, Gérard. Narrative Discourse. Cornell UP, 1980.', grade: 'B (Good)', reason: 'Proper MLA, minor punctuation.' },
      { citation: 'ipcc report climate change 2022', grade: 'D (Poor)', reason: 'No proper formatting.' },
      { citation: 'Keynes, J.M. The Economic Consequences. Macmillan, 1919.', grade: 'A (Excellent)', reason: 'Classic MLA format.' }
    ];
    return { pairs: pairs.sort(() => Math.random() - 0.5).slice(0, 4) };
  }

  function generateFillBlankMode() {
    const questions = [
      { sentence: 'A focused research question uses "______" rather than "How does..."', correct: 'To what extent', options: ['To what extent', 'How does', 'What is', 'Explain'], error: errorDB.rq_broad },
      { sentence: 'MLA book citation must include author, title, publisher, and ______.', correct: 'year of publication', options: ['year of publication', 'page count', 'ISBN', 'email'], error: errorDB.citation_format },
      { sentence: 'Academic writing requires a ______ register.', correct: 'formal', options: ['formal', 'casual', 'friendly', 'simple'], error: errorDB.informal_lang },
      { sentence: 'A strong conclusion should ______ findings.', correct: 'synthesize', options: ['synthesize', 'repeat', 'list', 'ignore'], error: errorDB.descriptive_conclusion },
      { sentence: 'Direct quotations require ______ numbers.', correct: 'page', options: ['page', 'chapter', 'volume', 'line'], error: errorDB.missing_pages }
    ];
    return questions[Math.floor(Math.random() * questions.length)];
  }

  function generateTimelineMode() {
    const statements = [
      { text: 'The research question must appear on the title page.', correct: true },
      { text: 'MLA uses "Works Cited" not "Bibliography".', correct: true },
      { text: 'Page numbers are required for direct quotations.', correct: true },
      { text: 'Contractions like "don\'t" are acceptable in formal writing.', correct: false },
      { text: 'A conclusion should introduce new arguments.', correct: false },
      { text: 'Mixing MLA and APA in one essay is acceptable.', correct: false },
      { text: 'The EE has a maximum word count of 4000 words.', correct: true }
    ];
    return { statements: statements.sort(() => Math.random() - 0.5).slice(0, 4) };
  }

  function generateSortingMode() {
    // More varied sequences for repeatability
    const sequences = [
      [{ text: 'Develop focused research question', order: 1, phase: 'Planning' },{ text: 'Compile preliminary bibliography', order: 2, phase: 'Research' },{ text: 'Write first complete draft', order: 3, phase: 'Drafting' },{ text: 'Apply consistent citation style', order: 4, phase: 'Revision' },{ text: 'Complete RPPF form', order: 5, phase: 'Final' }],
      [{ text: 'Identify subject and topic', order: 1, phase: 'Initial' },{ text: 'Formulate research question', order: 2, phase: 'Planning' },{ text: 'Gather sources and data', order: 3, phase: 'Research' },{ text: 'Analyze evidence critically', order: 4, phase: 'Writing' },{ text: 'Proofread and format', order: 5, phase: 'Submission' }],
      [{ text: 'Choose EE subject', order: 1, phase: 'Prep' },{ text: 'Meet with supervisor', order: 2, phase: 'Planning' },{ text: 'Conduct experiments/analysis', order: 3, phase: 'Investigation' },{ text: 'Draft reflections', order: 4, phase: 'Writing' },{ text: 'Final submission', order: 5, phase: 'Completion' }]
    ];
    const seq = sequences[Math.floor(Math.random() * sequences.length)];
    return { items: seq.sort(() => Math.random() - 0.5) };
  }

  // ============ RENDER FUNCTIONS ============
  function renderCurrentMode() {
    const area = document.getElementById('content-area');
    state.questionData = null;
    state.answered = false;
    state.selectedAnswer = null;
    state.matchPairs = {}; state.selectedSource = null; state.sortOrder = []; state.timelineAnswers = {};
    if (state.speedTimer) { clearInterval(state.speedTimer); state.speedTimer = null; }
    
    if (state.questionsAnswered >= state.totalQuestions) {
        showLeaderboard();
        return;
    }

    switch(state.currentMode) {
      case 'compare': renderCompareMode(area); break;
      case 'sentence': renderSentenceMode(area); break;
      case 'matching': renderMatchingMode(area); break;
      case 'fillblank': renderFillBlankMode(area); break;
      case 'timeline': renderTimelineMode(area); break;
      case 'sorting': renderSortingMode(area); break;
    }
    updateStats();
  }

  function renderCompareMode(area) {
    const data = generateCompareMode(); state.questionData = data;
    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div>
      <div class="question-card"><div class="question-header">ESSAY COMPARISON: Select the correctly formatted essay</div>
      <p style="color:#a0a0a0; margin-bottom:16px;">Subject: ${data.essay.subject}</p>`;
    data.options.forEach((opt, i) => {
      html += `<div class="essay-box" id="essay-${i}" onclick="selectEssay(${i})"><div style="font-weight:700; color:#e94560; font-size:16px;">ESSAY ${String.fromCharCode(65+i)}</div>${opt.html}</div>`;
    });
    html += `<div class="btn-group"><button class="btn btn-primary" onclick="submitCompare()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = html;
  }

  function renderSentenceMode(area) {
    const data = generateSentenceMode(); state.questionData = data;
    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div>
      <div class="question-card"><div class="question-header">SENTENCE HUNT: Find the ${data.error.name} error</div>`;
    data.sentences.forEach((s, i) => { html += `<div class="sentence-item" id="sentence-${i}" onclick="selectSentence(${i})"><b>${i+1}.</b> ${s.text}</div>`; });
    html += `<div class="btn-group"><button class="btn btn-primary" onclick="submitSentence()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = html;
  }

  function renderMatchingMode(area) {
    const data = generateMatchingMode(); state.questionData = data;
    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div>
      <div class="question-card"><div class="question-header">CITATION MATCHING</div><div class="matching-grid"><div><b style="color:#e94560;">SOURCES</b><div id="sources-list">`;
    data.pairs.forEach((p,i) => { html += `<div class="match-item" id="source-${i}" onclick="selectSource(${i})">${p.citation}</div>`; });
    html += `</div></div><div><b style="color:#00cc66;">GRADE DESCRIPTORS</b><div id="grades-list">`;
    const shuffledGrades = data.pairs.map(p => ({grade:p.grade, reason:p.reason})).sort(()=>Math.random()-0.5);
    state.questionData.shuffledGrades = shuffledGrades;
    shuffledGrades.forEach((g,i) => { const gc = g.grade.includes('A')?'grade-a':g.grade.includes('B')?'grade-b':g.grade.includes('C')?'grade-c':'grade-d';
      html += `<div class="match-item" id="grade-${i}" onclick="selectGrade(${i})"><span class="grade-badge ${gc}">${g.grade}</span><br>${g.reason}</div>`; });
    html += `</div></div></div><div class="btn-group"><button class="btn btn-primary" onclick="submitMatching()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = html;
  }

  function renderFillBlankMode(area) {
    const data = generateFillBlankMode(); state.questionData = data;
    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div>
      <div class="question-card"><div class="question-header">FILL IN THE BLANK</div><p style="color:#a0a0a0;">${data.error.name}</p>
      <div class="essay-box" style="cursor:default;">${data.sentence.replace('______','<span style="border-bottom:3px solid #e94560; color:#e94560;">______</span>')}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">`;
    data.options.forEach((opt,i) => { html += `<div class="sentence-item" id="blank-option-${i}" onclick="selectBlankOption(${i})">${opt}</div>`; });
    html += `</div><div class="btn-group"><button class="btn btn-primary" onclick="submitFillBlank()">SUBMIT</button><button class="btn btn-secondary" onclick="skipQuestion()">SKIP</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = html;
  }

  function renderTimelineMode(area) {
    const data = generateTimelineMode(); state.questionData = data; state.speedTimeLeft = 30; state.timelineAnswers = {};
    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div>
      <div class="question-card"><div class="question-header">SPEED ROUND (30s)</div><div style="text-align:center; font-size:40px; color:#ff4444;" id="speed-timer">30</div>`;
    data.statements.forEach((s,i) => { html += `<div class="essay-box" id="timeline-${i}"><p>${s.text}</p><div class="btn-group"><button class="btn btn-primary" onclick="answerTimeline(${i},true)">CORRECT</button><button class="btn btn-secondary" onclick="answerTimeline(${i},false)">INCORRECT</button></div></div>`; });
    html += `</div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = html;
    startSpeedTimer();
  }

  function renderSortingMode(area) {
    const data = generateSortingMode(); state.questionData = data;
    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${(state.questionsAnswered/state.totalQuestions)*100}%"></div></div>
      <div class="question-card"><div class="question-header">RANK ORDER: Arrange steps correctly</div>`;
    data.items.forEach((item,i) => { html += `<div class="essay-box" id="sort-item-${i}" onclick="selectSortItem(${i})"><span id="sort-number-${i}">#?</span> ${item.text} <small>(${item.phase})</small></div>`; });
    html += `<div class="btn-group"><button class="btn btn-primary" onclick="submitSorting()">SUBMIT</button><button class="btn btn-secondary" onclick="resetSorting()">RESET</button></div></div><div class="feedback-panel" id="feedback-panel"></div>`;
    area.innerHTML = html;
  }

  // ============ HANDLERS (SIMILAR TO V2) ============
  function selectEssay(i) { if(state.answered) return; document.querySelectorAll('.essay-box').forEach(e=>e.classList.remove('selected')); document.getElementById('essay-'+i).classList.add('selected'); state.selectedAnswer=i; }
  function selectSentence(i) { if(state.answered) return; document.querySelectorAll('.sentence-item').forEach(e=>e.classList.remove('selected')); document.getElementById('sentence-'+i).classList.add('selected'); state.selectedAnswer=i; }
  function selectSource(i) { if(state.answered) return; document.querySelectorAll('#sources-list .match-item').forEach(e=>e.classList.remove('selected')); document.getElementById('source-'+i).classList.add('selected'); state.selectedSource=i; }
  function selectGrade(i) { if(state.answered || state.selectedSource===null) return;
    Object.keys(state.matchPairs).forEach(k=>{ if(state.matchPairs[k]===i){ delete state.matchPairs[k]; document.getElementById('grade-'+i).classList.remove('matched'); document.getElementById('source-'+k).classList.remove('matched'); } });
    state.matchPairs[state.selectedSource]=i; document.getElementById('grade-'+i).classList.add('matched'); document.getElementById('source-'+state.selectedSource).classList.add('matched'); state.selectedSource=null; }
  function selectBlankOption(i) { if(state.answered) return; document.querySelectorAll('[id^="blank-option-"]').forEach(e=>e.classList.remove('selected')); document.getElementById('blank-option-'+i).classList.add('selected'); state.selectedAnswer=i; }
  function answerTimeline(i,ans) { if(state.answered||state.timelineAnswers[i]!==undefined) return; state.timelineAnswers[i]=ans; document.getElementById('timeline-'+i).style.opacity='0.6'; if(Object.keys(state.timelineAnswers).length===state.questionData.statements.length) submitTimeline(); }
  function selectSortItem(i) { if(state.answered) return; if(state.sortOrder.includes(i)) state.sortOrder=state.sortOrder.filter(x=>x!==i); else state.sortOrder.push(i); updateSortDisplay(); }
  function updateSortDisplay() { document.querySelectorAll('[id^="sort-item-"]').forEach(el=>{ let idx=parseInt(el.id.split('-')[2]); let pos=state.sortOrder.indexOf(idx); document.getElementById('sort-number-'+idx).textContent = pos>=0 ? '#'+(pos+1) : '#?'; }); }
  function resetSorting() { state.sortOrder=[]; updateSortDisplay(); }

  function skipQuestion() {
    if (state.speedTimer) clearInterval(state.speedTimer);
    state.questionsAnswered++;
    state.modeQuestionCount[state.currentMode]++;
    if (state.questionsAnswered >= state.totalQuestions) { showLeaderboard(); return; }
    renderCurrentMode();
  }

  function submitCompare() {
    if(state.answered||state.selectedAnswer===null) return;
    state.answered=true; const correct=state.selectedAnswer===state.questionData.correctIdx;
    processResult(correct); document.querySelectorAll('.essay-box').forEach(el=>{ let i=parseInt(el.id.split('-')[1]); if(i===state.questionData.correctIdx) el.classList.add('correct'); else if(i===state.selectedAnswer&&!correct) el.classList.add('incorrect'); });
    showFeedback(correct, state.questionData.options[state.questionData.correctIdx].errors);
  }
  function submitSentence() {
    if(state.answered||state.selectedAnswer===null) return;
    state.answered=true; const correct=state.selectedAnswer===state.questionData.errorPos;
    processResult(correct); document.getElementById('sentence-'+state.questionData.errorPos).classList.add('correct'); if(!correct) document.getElementById('sentence-'+state.selectedAnswer).classList.add('incorrect');
    showFeedback(correct, [state.questionData.error]);
  }
  function submitMatching() {
    if(state.answered||Object.keys(state.matchPairs).length<state.questionData.pairs.length) return;
    state.answered=true; let correctCount=0; state.questionData.pairs.forEach((p,i)=>{ if(state.questionData.shuffledGrades[state.matchPairs[i]]?.grade===p.grade) correctCount++; });
    processResult(correctCount===state.questionData.pairs.length); showMatchingFeedback(correctCount);
  }
  function submitFillBlank() {
    if(state.answered||state.selectedAnswer===null) return;
    state.answered=true; const correct=state.questionData.options[state.selectedAnswer]===state.questionData.correct;
    processResult(correct); showFeedback(correct, [state.questionData.error]);
  }
  function submitTimeline() {
    if(state.answered) return; state.answered=true; if(state.speedTimer) clearInterval(state.speedTimer);
    let correctCount=0; state.questionData.statements.forEach((s,i)=>{ if(state.timelineAnswers[i]===s.correct) correctCount++; });
    processResult(correctCount===state.questionData.statements.length);
    document.getElementById('speed-timer').textContent='DONE'; showFeedback(correctCount===state.questionData.statements.length, [], `Speed: ${correctCount}/${state.questionData.statements.length}`);
  }
  function submitSorting() {
    if(state.answered||state.sortOrder.length!==state.questionData.items.length) return;
    state.answered=true; let correct=true; state.sortOrder.forEach((idx,pos)=>{ if(state.questionData.items[idx].order!==pos+1) correct=false; });
    processResult(correct); showSortingFeedback(correct);
  }

  function processResult(correct) {
    state.questionsAnswered++; state.modeQuestionCount[state.currentMode]++;
    if(correct) { state.correctAnswers++; state.streak++; state.score+=10+state.streak*2; if(state.streak>=5) state.level=3; else if(state.streak>=3) state.level=2; }
    else { state.streak=0; state.score=Math.max(0,state.score-5); }
    updateStats();
    if (state.questionsAnswered >= state.totalQuestions) { setTimeout(showLeaderboard, 1500); }
  }

  function showFeedback(correct, errors, customMsg) {
    const panel=document.getElementById('feedback-panel'); let h=`<h4 style="color:${correct?'#00cc66':'#ff4444'};">${correct?'CORRECT':'INCORRECT'}</h4>`;
    if(customMsg) h+=`<p>${customMsg}</p>`;
    if(errors?.length) { errors.forEach(e=>h+=`<div class="error-item"><span class="grade-badge grade-d">${e.name}</span><p>${e.explanation}</p><p style="color:#00cc66;">Fix: ${e.fix}</p></div>`); }
    h+=`<div class="btn-group"><button class="btn btn-primary" onclick="if(state.questionsAnswered>=state.totalQuestions)showLeaderboard(); else renderCurrentMode();">NEXT</button></div>`;
    panel.innerHTML=h; panel.classList.add('visible'); panel.scrollIntoView({behavior:'smooth'});
  }
  function showMatchingFeedback(correctCount) { /* similar feedback with corrected pairs */ 
    const panel=document.getElementById('feedback-panel'); panel.innerHTML=`<h4>${correctCount}/${state.questionData.pairs.length} Matches</h4><button class="btn btn-primary" onclick="renderCurrentMode()">NEXT</button>`; panel.classList.add('visible'); }
  function showSortingFeedback(correct) { document.getElementById('feedback-panel').innerHTML=`<h4>${correct?'Correct Order':'Incorrect'}</h4><button class="btn btn-primary" onclick="renderCurrentMode()">NEXT</button>`; document.getElementById('feedback-panel').classList.add('visible'); }

  function startSpeedTimer() {
    state.speedTimeLeft=30; state.speedTimer=setInterval(()=>{ state.speedTimeLeft--; const el=document.getElementById('speed-timer'); if(el){ el.textContent=state.speedTimeLeft; if(state.speedTimeLeft<=10) el.style.color='#ff0000'; } if(state.speedTimeLeft<=0){ clearInterval(state.speedTimer); if(!state.answered) submitTimeline(); } },1000);
  }

  function updateStats() {
    document.getElementById('score-display').textContent=state.score; document.getElementById('streak-display').textContent=state.streak;
    document.getElementById('question-display').textContent=state.questionsAnswered+'/'+state.totalQuestions;
    document.getElementById('level-display').textContent=state.level;
    document.getElementById('accuracy-display').textContent=state.questionsAnswered?Math.round((state.correctAnswers/state.questionsAnswered)*100)+'%':'0%';
    document.getElementById('time-display').textContent=formatTime(state.globalTime);
  }

  function formatTime(s) { const m=Math.floor(s/60); const sec=s%60; return m+':'+(sec<10?'0':'')+sec; }

  function showLeaderboard() {
    document.getElementById('content-area').innerHTML = '';
    const container = document.getElementById('leaderboard-container');
    const entry = {
        score: state.score,
        accuracy: state.questionsAnswered ? Math.round((state.correctAnswers/state.questionsAnswered)*100) : 0,
        level: state.level,
        time: formatTime(state.globalTime)
    };
    state.leaderboard.push(entry);
    state.leaderboard.sort((a,b) => b.score - a.score);
    state.leaderboard = state.leaderboard.slice(0, 5);
    
    let html = `<div class="leaderboard"><h2>🏆 LEADERBOARD 🏆</h2><p style="margin-bottom:16px;">Session Complete! Questions: ${state.totalQuestions}</p>`;
    state.leaderboard.forEach((e,i) => {
        html += `<div class="leaderboard-entry"><span>#${i+1}</span><span>Score: ${e.score}</span><span>Acc: ${e.accuracy}%</span><span>Lv.${e.level}</span><span>${e.time}</span></div>`;
    });
    html += `<button class="btn btn-primary" style="margin-top:20px;" onclick="resetGame()">PLAY AGAIN</button></div>`;
    container.innerHTML = html;
  }

  function resetGame() {
    state.score = 0; state.questionsAnswered = 0; state.streak = 0; state.correctAnswers = 0; state.level = 1; state.globalTime = 0;
    state.modeTimers = { compare:0, sentence:0, matching:0, fillblank:0, timeline:0, sorting:0 };
    state.modeQuestionCount = { compare:0, sentence:0, matching:0, fillblank:0, timeline:0, sorting:0 };
    state.leaderboard = [];
    document.getElementById('leaderboard-container').innerHTML = '';
    clearInterval(state.modeIntervalId);
    startModeTimerInterval();
    renderCurrentMode();
  }

  function startModeTimerInterval() {
      if (state.modeIntervalId) clearInterval(state.modeIntervalId);
      state.modeIntervalId = setInterval(() => {
          state.globalTime++;
          state.modeTimers[state.currentMode]++;
          document.getElementById('time-display').textContent = formatTime(state.globalTime);
          document.getElementById('timer-'+state.currentMode).textContent = formatTime(state.modeTimers[state.currentMode]);
      }, 1000);
  }

  document.getElementById('mode-nav').addEventListener('click', function(e) {
    const btn = e.target.closest('.mode-btn');
    if (!btn || state.questionsAnswered >= state.totalQuestions) return;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.currentMode = btn.dataset.mode;
    if (state.speedTimer) { clearInterval(state.speedTimer); state.speedTimer = null; }
    renderCurrentMode();
  });

  startModeTimerInterval();
  renderCurrentMode();
  updateStats();
</script>

</body>
</html>
