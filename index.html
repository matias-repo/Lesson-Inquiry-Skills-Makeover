<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Game - 25 Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px 25px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .mode-btn:hover {
            background: #667eea20;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #718096;
            font-size: 0.85rem;
            display: block;
        }

        .stat-value {
            color: #2d3748;
            font-size: 1.3rem;
            font-weight: bold;
            display: block;
        }

        .question-area {
            background: #edf2f7;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-text {
            font-size: 1.3rem;
            color: #2d3748;
            text-align: center;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .question-category {
            text-align: center;
            color: #667eea;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .timer-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 10px;
            min-height: 36px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            color: #2d3748;
            word-wrap: break-word;
            hyphens: auto;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #667eea10;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
        }

        .option-btn.incorrect {
            background: #f56565;
            color: white;
            border-color: #f56565;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 30px;
            line-height: 1.4;
        }

        .next-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .next-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .next-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .game-over-message {
            text-align: center;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #2d3748;
        }

        .leaderboard {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .leaderboard h2 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 15px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .leaderboard-table th {
            background: #667eea;
            color: white;
            font-weight: 500;
        }

        .leaderboard-table tr:nth-child(even) {
            background: #edf2f7;
        }

        .leaderboard-table tr.current-player {
            background: #c6f6d5;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-gold {
            background: #f6e05e;
            color: #744210;
        }

        .badge-silver {
            background: #cbd5e0;
            color: #2d3748;
        }

        .badge-bronze {
            background: #ed8936;
            color: #fff;
        }

        .play-again-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            font-weight: 500;
        }

        .play-again-btn:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .options {
                grid-template-columns: 1fr;
            }
            .mode-selector {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Trivia Challenge</h1>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="normal">Normal Mode</button>
            <button class="mode-btn" data-mode="speed">Speed Round ⚡</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Question</span>
                <span class="stat-value" id="questionCount">0/25</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Correct</span>
                <span class="stat-value" id="correctCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Percentage</span>
                <span class="stat-value" id="percentage">0%</span>
            </div>
            <div class="stat-item speed-only hidden" id="timerStat">
                <span class="stat-label">Time Left</span>
                <span class="stat-value" id="timerDisplay">10s</span>
            </div>
        </div>

        <div class="question-area">
            <div class="question-category" id="category"></div>
            <div class="question-text" id="questionText"></div>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="options" id="optionsContainer"></div>

        <button class="next-btn" id="nextBtn" disabled>Next Question →</button>

        <div class="game-over-message hidden" id="gameOverMessage"></div>

        <div class="leaderboard" id="leaderboard">
            <h2>🏆 Leaderboard</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Score</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="4">No scores yet. Play a game!</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="play-again-btn hidden" id="playAgainBtn">Play Again 🔄</button>
    </div>

    <script>
        // Extensive question bank with variety
        const questionBank = [
            // Science
            { category: "Science", question: "What is the chemical symbol for gold?", options: ["Au", "Ag", "Go", "Gd"], correct: 0 },
            { category: "Science", question: "What planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
            { category: "Science", question: "What gas do plants absorb from the atmosphere?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 2 },
            { category: "Science", question: "What is the largest organ in the human body?", options: ["Heart", "Brain", "Liver", "Skin"], correct: 3 },
            { category: "Science", question: "What force keeps us on the ground?", options: ["Magnetism", "Gravity", "Friction", "Inertia"], correct: 1 },
            { category: "Science", question: "How many bones are in the adult human body?", options: ["186", "206", "226", "256"], correct: 1 },
            { category: "Science", question: "What is the speed of light approximately?", options: ["300,000 km/s", "150,000 km/s", "500,000 km/s", "1,000,000 km/s"], correct: 0 },
            { category: "Science", question: "Which element has the atomic number 1?", options: ["Helium", "Hydrogen", "Lithium", "Oxygen"], correct: 1 },
            
            // History
            { category: "History", question: "In which year did World War II end?", options: ["1943", "1944", "1945", "1946"], correct: 2 },
            { category: "History", question: "Who was the first President of the United States?", options: ["Thomas Jefferson", "John Adams", "George Washington", "Benjamin Franklin"], correct: 2 },
            { category: "History", question: "What ancient civilization built the pyramids?", options: ["Romans", "Greeks", "Egyptians", "Persians"], correct: 2 },
            { category: "History", question: "The French Revolution began in which year?", options: ["1776", "1789", "1799", "1804"], correct: 1 },
            { category: "History", question: "Who discovered America in 1492?", options: ["Vasco da Gama", "Ferdinand Magellan", "Christopher Columbus", "Amerigo Vespucci"], correct: 2 },
            { category: "History", question: "What empire was ruled by Julius Caesar?", options: ["Greek", "Ottoman", "Roman", "Persian"], correct: 2 },
            
            // Geography
            { category: "Geography", question: "What is the capital of Australia?", options: ["Sydney", "Melbourne", "Canberra", "Perth"], correct: 2 },
            { category: "Geography", question: "Which is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
            { category: "Geography", question: "What country has the most people?", options: ["India", "China", "USA", "Indonesia"], correct: 0 },
            { category: "Geography", question: "Mount Everest is in which mountain range?", options: ["Andes", "Alps", "Himalayas", "Rockies"], correct: 2 },
            { category: "Geography", question: "What river is the longest in the world?", options: ["Amazon", "Nile", "Mississippi", "Yangtze"], correct: 1 },
            { category: "Geography", question: "Which continent is the Sahara Desert located on?", options: ["Asia", "Africa", "Australia", "South America"], correct: 1 },
            
            // Entertainment
            { category: "Entertainment", question: "Who played Iron Man in the Marvel movies?", options: ["Chris Evans", "Robert Downey Jr.", "Chris Hemsworth", "Mark Ruffalo"], correct: 1 },
            { category: "Entertainment", question: "What band performed at the first Live Aid?", options: ["Queen", "The Beatles", "Led Zeppelin", "Pink Floyd"], correct: 0 },
            { category: "Entertainment", question: "Which movie won the Oscar for Best Picture in 1994?", options: ["Pulp Fiction", "Forrest Gump", "The Shawshank Redemption", "The Lion King"], correct: 1 },
            { category: "Entertainment", question: "Who is the author of the Harry Potter series?", options: ["J.R.R. Tolkien", "J.K. Rowling", "Stephen King", "George R.R. Martin"], correct: 1 },
            { category: "Entertainment", question: "What TV series features dragons and the Iron Throne?", options: ["The Witcher", "Game of Thrones", "Lord of the Rings", "Vikings"], correct: 1 },
            
            // Sports
            { category: "Sports", question: "How many players are on a soccer team on the field?", options: ["9", "10", "11", "12"], correct: 2 },
            { category: "Sports", question: "In which sport would you perform a slam dunk?", options: ["Volleyball", "Basketball", "Tennis", "Baseball"], correct: 1 },
            { category: "Sports", question: "Which country has won the most World Cups in soccer?", options: ["Germany", "Argentina", "Brazil", "Italy"], correct: 2 },
            { category: "Sports", question: "What sport is played at Wimbledon?", options: ["Golf", "Tennis", "Cricket", "Rugby"], correct: 1 },
            { category: "Sports", question: "How many rings are on the Olympic flag?", options: ["3", "4", "5", "6"], correct: 2 },
            
            // Technology
            { category: "Technology", question: "Who co-founded Apple Inc.?", options: ["Bill Gates", "Steve Jobs", "Jeff Bezos", "Mark Zuckerberg"], correct: 1 },
            { category: "Technology", question: "What does 'HTTP' stand for?", options: ["HyperText Transfer Protocol", "High Tech Text Protocol", "Hyper Transfer Text Program", "Home Tool Transfer Protocol"], correct: 0 },
            { category: "Technology", question: "What year was the first iPhone released?", options: ["2005", "2006", "2007", "2008"], correct: 2 },
            { category: "Technology", question: "What programming language is primarily used for web pages?", options: ["Python", "Java", "JavaScript", "C++"], correct: 2 },
            
            // Food & Culture
            { category: "Food & Culture", question: "Sushi is a traditional dish from which country?", options: ["China", "Korea", "Thailand", "Japan"], correct: 3 },
            { category: "Food & Culture", question: "What is the main ingredient in guacamole?", options: ["Tomato", "Avocado", "Onion", "Pepper"], correct: 1 },
            { category: "Food & Culture", question: "Which country is famous for inventing pizza?", options: ["France", "Italy", "Greece", "Spain"], correct: 1 },
            { category: "Food & Culture", question: "What spice gives curry its yellow color?", options: ["Paprika", "Turmeric", "Cumin", "Saffron"], correct: 1 },
            
            // Math
            { category: "Math", question: "What is the square root of 144?", options: ["10", "11", "12", "13"], correct: 2 },
            { category: "Math", question: "What is 15 × 15?", options: ["200", "215", "225", "250"], correct: 2 },
            { category: "Math", question: "What is the value of Pi rounded to 2 decimal places?", options: ["3.12", "3.14", "3.16", "3.18"], correct: 1 },
            
            // Nature
            { category: "Nature", question: "What is the fastest land animal?", options: ["Lion", "Cheetah", "Gazelle", "Horse"], correct: 1 },
            { category: "Nature", question: "How many hearts does an octopus have?", options: ["1", "2", "3", "4"], correct: 2 },
            { category: "Nature", question: "What type of tree produces acorns?", options: ["Oak", "Maple", "Pine", "Birch"], correct: 0 },
        ];

        // Game state
        let gameState = {
            mode: 'normal',
            questionNumber: 0,
            totalQuestions: 0,
            correctAnswers: 0,
            answered: false,
            currentQuestion: null,
            leaderboard: JSON.parse(localStorage.getItem('triviaLeaderboard') || '[]'),
            speedTimer: null,
            timeLeft: 10,
            totalTime: 0,
            questionStartTime: null,
        };

        // DOM elements
        const questionText = document.getElementById('questionText');
        const category = document.getElementById('category');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        const questionCount = document.getElementById('questionCount');
        const correctCount = document.getElementById('correctCount');
        const percentage = document.getElementById('percentage');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const timerStat = document.getElementById('timerStat');
        const timerDisplay = document.getElementById('timerDisplay');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // Initialize game
        function initGame() {
            gameState.questionNumber = 0;
            gameState.totalQuestions = 0;
            gameState.correctAnswers = 0;
            gameState.answered = false;
            gameState.currentQuestion = null;
            gameState.totalTime = 0;
            updateStats();
            clearSpeedTimer();
            gameOverMessage.classList.add('hidden');
            playAgainBtn.classList.add('hidden');
            feedback.textContent = '';
            nextBtn.disabled = true;
            
            if (gameState.mode === 'speed') {
                timerStat.classList.remove('hidden');
            } else {
                timerStat.classList.add('hidden');
            }
            
            loadNewQuestion();
        }

        function switchMode(mode) {
            if (gameState.mode === mode) return;
            
            gameState.mode = mode;
            // Reset counters when switching modes
            gameState.questionNumber = 0;
            gameState.totalQuestions = 0;
            gameState.correctAnswers = 0;
            gameState.answered = false;
            gameState.currentQuestion = null;
            gameState.totalTime = 0;
            
            clearSpeedTimer();
            updateStats();
            
            if (mode === 'speed') {
                timerStat.classList.remove('hidden');
            } else {
                timerStat.classList.add('hidden');
            }
            
            gameOverMessage.classList.add('hidden');
            playAgainBtn.classList.add('hidden');
            feedback.textContent = '';
            nextBtn.disabled = true;
            
            loadNewQuestion();
        }

        function updateStats() {
            questionCount.textContent = `${gameState.questionNumber}/25`;
            correctCount.textContent = gameState.correctAnswers;
            const pct = gameState.questionNumber > 0 ? Math.round((gameState.correctAnswers / gameState.questionNumber) * 100) : 0;
            percentage.textContent = `${pct}%`;
        }

        function loadNewQuestion() {
            clearSpeedTimer();
            
            // Check if game is over
            if (gameState.questionNumber >= 25) {
                endGame();
                return;
            }

            // Pick a random question
            const randomIndex = Math.floor(Math.random() * questionBank.length);
            gameState.currentQuestion = questionBank[randomIndex];
            gameState.answered = false;
            
            // Update display
            category.textContent = gameState.currentQuestion.category;
            questionText.textContent = gameState.currentQuestion.question;
            feedback.textContent = '';
            
            // Create option buttons
            optionsContainer.innerHTML = '';
            gameState.currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(btn);
            });
            
            nextBtn.disabled = true;
            
            // Start speed timer if in speed mode
            if (gameState.mode === 'speed') {
                gameState.timeLeft = 10;
                gameState.questionStartTime = Date.now();
                timerDisplay.textContent = `${gameState.timeLeft}s`;
                startSpeedTimer();
            }
        }

        function startSpeedTimer() {
            clearSpeedTimer();
            gameState.speedTimer = setInterval(() => {
                gameState.timeLeft--;
                timerDisplay.textContent = `${gameState.timeLeft}s`;
                
                if (gameState.timeLeft <= 3) {
                    timerDisplay.style.color = '#e53e3e';
                }
                
                if (gameState.timeLeft <= 0) {
                    clearSpeedTimer();
                    if (!gameState.answered) {
                        timeUp();
                    }
                }
            }, 1000);
        }

        function clearSpeedTimer() {
            if (gameState.speedTimer) {
                clearInterval(gameState.speedTimer);
                gameState.speedTimer = null;
            }
            timerDisplay.style.color = '#e53e3e';
        }

        function timeUp() {
            gameState.answered = true;
            gameState.questionNumber++;
            
            // Record 10 seconds as time taken for this question
            if (gameState.questionStartTime) {
                gameState.totalTime += 10;
            }
            
            // Highlight correct answer
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach((btn, index) => {
                btn.disabled = true;
                if (index === gameState.currentQuestion.correct) {
                    btn.classList.add('correct');
                }
            });
            
            feedback.innerHTML = `⏰ Time's up! The correct answer was: <strong>${gameState.currentQuestion.options[gameState.currentQuestion.correct]}</strong>`;
            feedback.style.color = '#e53e3e';
            
            updateStats();
            
            if (gameState.questionNumber >= 25) {
                endGame();
            } else {
                nextBtn.disabled = false;
            }
        }

        function selectOption(selectedIndex) {
            if (gameState.answered) return;
            
            gameState.answered = true;
            gameState.questionNumber++;
            clearSpeedTimer();
            
            // Calculate time taken for this question
            if (gameState.questionStartTime && gameState.mode === 'speed') {
                const timeTaken = (Date.now() - gameState.questionStartTime) / 1000;
                gameState.totalTime += Math.min(timeTaken, 10);
            }
            
            const isCorrect = selectedIndex === gameState.currentQuestion.correct;
            const optionBtns = document.querySelectorAll('.option-btn');
            
            optionBtns.forEach((btn, index) => {
                btn.disabled = true;
                if (index === gameState.currentQuestion.correct) {
                    btn.classList.add('correct');
                }
            });
            
            if (isCorrect) {
                gameState.correctAnswers++;
                optionBtns[selectedIndex].classList.add('correct');
                feedback.textContent = '✅ Correct! Great job!';
                feedback.style.color = '#48bb78';
            } else {
                optionBtns[selectedIndex].classList.add('incorrect');
                feedback.innerHTML = `❌ Incorrect! The correct answer was: <strong>${gameState.currentQuestion.options[gameState.currentQuestion.correct]}</strong>`;
                feedback.style.color = '#f56565';
            }
            
            updateStats();
            
            if (gameState.questionNumber >= 25) {
                endGame();
            } else {
                nextBtn.disabled = false;
            }
        }

        function endGame() {
            clearSpeedTimer();
            
            const pct = gameState.questionNumber > 0 ? Math.round((gameState.correctAnswers / gameState.questionNumber) * 100) : 0;
            const timeTaken = gameState.mode === 'speed' ? gameState.totalTime.toFixed(1) : 0;
            
            // Add to leaderboard
            const playerName = `Player${Math.floor(Math.random() * 1000)}`;
            const entry = {
                name: playerName,
                score: pct,
                time: parseFloat(timeTaken),
                mode: gameState.mode,
                date: new Date().toLocaleDateString()
            };
            
            gameState.leaderboard.push(entry);
            
            // Sort leaderboard by percentage (descending), then by time (ascending) for ties
            gameState.leaderboard.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return a.time - b.time;
            });
            
            // Keep top 10 scores
            gameState.leaderboard = gameState.leaderboard.slice(0, 10);
            
            localStorage.setItem('triviaLeaderboard', JSON.stringify(gameState.leaderboard));
            
            // Show game over
            gameOverMessage.classList.remove('hidden');
            playAgainBtn.classList.remove('hidden');
            
            let message = `🎮 Game Over! You got ${gameState.correctAnswers} out of ${gameState.questionNumber} correct (${pct}%)`;
            if (gameState.mode === 'speed') {
                message += `<br>⏱️ Total time: ${timeTaken}s`;
            }
            gameOverMessage.innerHTML = message;
            
            questionText.textContent = 'Game Complete!';
            category.textContent = '';
            optionsContainer.innerHTML = '';
            feedback.textContent = '';
            nextBtn.disabled = true;
            
            // Disable mode buttons during game over
            modeBtns.forEach(btn => btn.disabled = true);
            
            renderLeaderboard(pct, timeTaken);
        }

        function renderLeaderboard(currentScore, currentTime) {
            if (gameState.leaderboard.length === 0) {
                leaderboardBody.innerHTML = '<tr><td colspan="4">No scores yet. Play a game!</td></tr>';
                return;
            }
            
            leaderboardBody.innerHTML = gameState.leaderboard.map((entry, index) => {
                let rankBadge = '';
                if (index === 0) rankBadge = '<span class="badge badge-gold">🥇</span>';
                else if (index === 1) rankBadge = '<span class="badge badge-silver">🥈</span>';
                else if (index === 2) rankBadge = '<span class="badge badge-bronze">🥉</span>';
                
                const isCurrent = entry.score === currentScore && entry.time === parseFloat(currentTime);
                const rowClass = isCurrent ? 'current-player' : '';
                
                const timeDisplay = entry.time > 0 ? `${entry.time}s` : 'N/A';
                
                return `<tr class="${rowClass}">
                    <td>${rankBadge} ${index + 1}</td>
                    <td>${entry.name}</td>
                    <td>${entry.score}%</td>
                    <td>${timeDisplay}</td>
                </tr>`;
            }).join('');
        }

        function playAgain() {
            gameState.questionNumber = 0;
            gameState.totalQuestions = 0;
            gameState.correctAnswers = 0;
            gameState.answered = false;
            gameState.currentQuestion = null;
            gameState.totalTime = 0;
            
            updateStats();
            clearSpeedTimer();
            
            gameOverMessage.classList.add('hidden');
            playAgainBtn.classList.add('hidden');
            feedback.textContent = '';
            nextBtn.disabled = true;
            
            if (gameState.mode === 'speed') {
                timerStat.classList.remove('hidden');
            } else {
                timerStat.classList.add('hidden');
            }
            
            // Re-enable mode buttons
            modeBtns.forEach(btn => btn.disabled = false);
            
            loadNewQuestion();
        }

        // Event listeners
        nextBtn.addEventListener('click', loadNewQuestion);
        playAgainBtn.addEventListener('click', playAgain);
        
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mode = e.target.dataset.mode;
                // Re-enable all mode buttons
                modeBtns.forEach(b => b.disabled = false);
                // Update active state
                modeBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                switchMode(mode);
            });
        });

        // Initialize
        initGame();
        renderLeaderboard(0, 0);
    </script>
</body>
</html>
